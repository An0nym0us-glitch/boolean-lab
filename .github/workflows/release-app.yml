name: Build BooleanLab installer and publish release

# Builds the Windows installer from the BooleanLab source repository and
# attaches it to a GitHub Release in this repository under fixed file names,
# so the website can link straight to
#   releases/latest/download/BooleanLab-Setup-x64.exe
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of logic-gates-lab to build"
        default: "main"
        required: false
  push:
    paths:
      - ".github/workflows/release-app.yml"

permissions:
  contents: write

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  windows:
    name: Build installer (MSVC, Qt 5.15.2)
    runs-on: windows-2022
    steps:
      - name: Check out BooleanLab source
        uses: actions/checkout@v4
        with:
          repository: An0nym0us-glitch/logic-gates-lab
          ref: ${{ github.event.inputs.ref || '' }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build, test, deploy and package
        shell: pwsh
        run: ./installer/build-release.ps1

      - name: Prepare release files
        id: files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $match = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path out | Out-Null
          $setup = Get-ChildItem dist/BooleanLab-Setup-*-x64.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/BooleanLab-Setup-x64.exe
          Compress-Archive -Path build-release/deploy/* -DestinationPath out/BooleanLab-portable-x64.zip
          $sha = (git rev-parse --short HEAD).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Get-ChildItem out | Format-Table Name, Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: app-v${{ steps.files.outputs.version }}
          VERSION: ${{ steps.files.outputs.version }}
          SHA: ${{ steps.files.outputs.sha }}
        run: |
          $notes = "BooleanLab $env:VERSION for Windows 10 and 11 (64-bit), built from An0nym0us-glitch/logic-gates-lab@$env:SHA.`n`n" +
                   "- BooleanLab-Setup-x64.exe: installer (Start Menu entry, uninstaller, optional .blab file association; 'Install for me only' needs no admin rights)`n" +
                   "- BooleanLab-portable-x64.zip: unzip and run BooleanLab.exe, no installation"
          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG out/BooleanLab-Setup-x64.exe out/BooleanLab-portable-x64.zip --clobber --repo $env:REPO
            gh release edit $env:TAG --notes $notes --latest --repo $env:REPO
          } else {
            gh release create $env:TAG out/BooleanLab-Setup-x64.exe out/BooleanLab-portable-x64.zip `
              --title "BooleanLab $env:VERSION" --notes $notes --latest --repo $env:REPO
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
